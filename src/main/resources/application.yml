spring:
  application:
    name: fiscal-invoicing-service
  datasource:
    # Usuario de la aplicacion: miembro de fiscal_app_role, sin BYPASSRLS ni propiedad de tablas.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/e_sentinel}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:12345}
  flyway:
    # Migraciones con el usuario propietario (credenciales distintas a las de la app).
    url: ${FLYWAY_URL:${DB_URL:jdbc:postgresql://localhost:5432/e_sentinel}}
    user: ${FLYWAY_USER:postgres}
    password: ${FLYWAY_PASSWORD:12345}
  jackson:
    default-property-inclusion: non_null
  security:
    oauth2:
      resourceserver:
        jwt:
          # Obligatorio: emisor OIDC (Keycloak/Cognito/Auth0). Sin esto la app no arranca (fail-fast).
          issuer-uri: ${OIDC_ISSUER_URI}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

logging:
  pattern:
    level: "%5p [corr=%X{correlationId:-}]"

solid:
  fiscal:
    security:
      tenant-claim: tenant_id
      roles-claim: roles
    crypto:
      # Llavero local AES-256 (dev/test). Env: SOLID_FISCAL_CRYPTO_ACTIVE_KEY_ID, SOLID_FISCAL_CRYPTO_KEYS_<ID>=<base64 32 bytes>
      active-key-id: ${SOLID_FISCAL_CRYPTO_ACTIVE_KEY_ID:}
    siat:
      endpoints:
        pilot: https://pilotosiatservicios.impuestos.gob.bo/v2
        # URL de produccion pendiente de confirmacion oficial (se entrega al finalizar la autorizacion).
        production: https://siatrest.impuestos.gob.bo/v2
      connect-timeout-ms: 5000
      receive-timeout-ms: 15000
      auth-header-name: apikey
      auth-header-prefix: "TokenApi "
    outbox:
      relay:
        enabled: true
        interval-ms: 1000
        batch-size: 100
      kafka:
        enabled: false
        topic-prefix: "solid.fiscal."
