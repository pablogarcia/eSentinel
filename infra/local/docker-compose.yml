# Entorno local. Credenciales de DESARROLLO unicamente.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: solid_fiscal
      POSTGRES_USER: fiscal_owner
      POSTGRES_PASSWORD: fiscal_owner_dev
    ports:
      - "5432:5432"
    volumes:
      - ../../src/test/resources/db/init-roles.sql:/docker-entrypoint-initdb.d/01-init-roles.sql:ro
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
